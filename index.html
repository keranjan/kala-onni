<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Kala-Onni – kalastuskartta ja kalasääennuste</title>
  <meta name="description" content="Näe lähialueesi kalapaikat kartalla, todennäköiset kalalajit sekä sääennuste ja vuorokauden parhaat kalastusajat." />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8E%A3%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <a class="skip-link" href="#panel">Siirry tietopaneeliin</a>

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">🎣</span>
      <span class="brand-text">
        <strong>Kala-Onni</strong>
        <span class="brand-sub">Kalapaikat, kalalajit ja kalasää</span>
      </span>
    </div>

    <form class="search" id="search-form" role="search">
      <label class="sr-only" for="search-input">Hae paikkakunta tai vesistö</label>
      <input id="search-input" type="search" placeholder="Hae paikkakunta tai vesistö…" autocomplete="off" spellcheck="false" />
      <button type="submit" class="btn btn-ghost" title="Hae">Hae</button>
      <ul id="search-results" class="search-results" hidden></ul>
    </form>

    <div class="header-actions">
      <button type="button" class="btn btn-primary" id="locate-btn">
        <span aria-hidden="true">📍</span> Paikanna minut
      </button>
      <button type="button" class="btn btn-icon" id="theme-btn" aria-label="Vaihda teemaa" title="Vaihda teemaa">◐</button>
    </div>
  </header>

  <main class="layout">
    <section class="map-wrap" aria-label="Kartta">
      <div id="map"></div>
      <div class="map-hint" id="map-hint">Napauta karttaa valitaksesi paikan</div>
      <div class="map-legend" aria-hidden="true">
        <span><i class="dot dot-spot"></i> Kalapaikka</span>
        <span><i class="dot dot-water"></i> Vesistö</span>
        <span><i class="dot dot-me"></i> Sijaintisi</span>
      </div>
    </section>

    <aside class="panel" id="panel">
      <div class="place-bar">
        <div class="place-name" id="place-name">Haetaan sijaintia…</div>
        <div class="place-meta" id="place-meta"></div>
      </div>

      <div class="tabs" role="tablist" aria-label="Näkymät">
        <button role="tab" id="tab-spots" aria-controls="view-spots" aria-selected="true" class="tab">Paikat</button>
        <button role="tab" id="tab-species" aria-controls="view-species" aria-selected="false" class="tab" tabindex="-1">Kalat</button>
        <button role="tab" id="tab-weather" aria-controls="view-weather" aria-selected="false" class="tab" tabindex="-1">Kalasää</button>
      </div>

      <div class="views">
        <section role="tabpanel" id="view-spots" aria-labelledby="tab-spots" class="view" tabindex="0">
          <div class="toolbar">
            <label for="radius-select">Etsi säteellä</label>
            <select id="radius-select">
              <option value="5">5 km</option>
              <option value="10" selected>10 km</option>
              <option value="25">25 km</option>
              <option value="50">50 km</option>
            </select>
            <button type="button" class="btn btn-ghost" id="refresh-spots">Päivitä</button>
          </div>
          <div id="spots-list" class="list"></div>
        </section>

        <section role="tabpanel" id="view-species" aria-labelledby="tab-species" class="view" hidden tabindex="0">
          <div id="species-intro" class="note"></div>
          <div id="species-list" class="list"></div>
        </section>

        <section role="tabpanel" id="view-weather" aria-labelledby="tab-weather" class="view" hidden tabindex="0">
          <div id="weather-content"></div>
        </section>
      </div>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
